title: "Verein – SV Kirch-Grottenherten"
description: "Informationen über den Vorstand, das Sportplatz-Team, den Jugendvorstand, unsere Satzung und das Vereinslied."
vorstandTitle: "Vorstand"
vorstandIntro: "Der Vorstand der Spvgg. Kirch-Grottenherten 1945 e.V. kümmert sich um alle organisatorischen Belange des Vereins."
jugendTitle: "Jugendvorstand"
jugendIntro: "Unser Jugendvorstand kümmert sich um die Förderung und Betreuung unserer Nachwuchsspieler."
sportplatzTitle: "Sportplatz-Team"
sportplatzIntro: "Unser Sportplatz-Team sorgt dafür, dass unsere Anlagen immer in bestem Zustand sind."
satzungTitle: "Satzung"
satzungIntro: "Die aktuelle Satzung des Vereins steht Ihnen hier zum Download zur Verfügung."
liedTitle: "Vereinslied"
liedIntro: "Das Lied der SpVgg. Kirch-Grottenherten – seit Generationen ein Stück Heimat."
liedText: |
  Wo die braunen Äcker schenken
  ihre Früchte überreich
  Wo am Fußball alle hängen
  Alt und Jung und Arm und Reich.
  Da klingts vom Dorfe her, halihalo
  an manchen Abend halihalo
  ein neues Lied ins Land hinein, ins Land hinein:
  "Kirch-und Grottenherten haben wieder einen Spielverein."

  Müssen wir auch manchmal ringen
  um den Sieg in schwerem Streit.
  Hält das Glück uns beim Gelingen
  hol den Kampfespreis bereit.
  Da klingts vom Dorfe her halihalo
  an manchen Abend halihalo,
  ein neues Lied ins Land hinein, ins Land hinein:
  "Kirch-und Grottenherten lieben ihren Spielverein."

  Kämen einst auch schwere Tage
  sollten wir nicht siegreich sein.
  Wir verlieren ohne Klage
  denn wir stehen nicht allein.
  Solang vom Dorfe klingt halihalo
  an manchen Abend halihalo
  dies stolze Lied ins Land hinein, ins Land hinein:
  "Kirch-und Grottenherten halten treu zu ihrem Sportverein."
