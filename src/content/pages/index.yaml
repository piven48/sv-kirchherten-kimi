title: "SV Kirch-Grottenherten — Dorfverein seit 1945"
description: "Herzlich Willkommen auf der Website der SpVgg. Kirch-Grottenherten. Hier erfahren Sie alles über unsere Mannschaften, den Vorstand und wie Sie Mitglied werden können."
heroHeadline: "Kirchherten – Dorfverein seit 1945"
heroText: "Herzlich Willkommen auf der Website der SpVgg. Kirch-Grottenherten. Hier erfahren Sie alles zum Kader, zu den Tabellen, zum Spielplan und vielem mehr. Kommen Sie sonntags zu den Spielen und lassen Sie sich vom Kreisliga-Zauber anstecken."
welcomeTitle: "Willkommen beim SV Kirch-Grottenherten"
welcomeText: "Sie können die Route zum Sportplatz planen, einen Mitgliedsantrag ausfüllen oder auch unser Vereinslied anstimmen. Mit dieser Website bieten wir Ihnen einen kompakten Überblick über den Verein Kirch-Grottenherten. Dabei sind auch wir nicht frei von Fehlern und versuchen uns stetig zu verbessern und das Angebot auf dieser Seite zu erweitern."
ctaTitle: "Werden Sie Teil unseres Vereins"
ctaText: "Oder Sie gehen noch einen Schritt weiter und werden direkt Mitglied und kommen vielleicht mal zum Probetraining. Niemand wird vom Hof gescheucht. Alle sind Willkommen."
